name: PowerShell CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint-and-parse:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PowerShell modules
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path ./ADUserAudit.ps1 -Recurse
          if ($results) {
            $results |
              Select-Object RuleName, Severity, ScriptName, Line, Message |
              Format-Table -AutoSize
            throw "PSScriptAnalyzer found $($results.Count) issue(s)."
          }

      - name: Parse script
        shell: pwsh
        run: |
          [void][scriptblock]::Create((Get-Content -Raw -Path ./ADUserAudit.ps1))
          Write-Host "PowerShell parse check passed."
